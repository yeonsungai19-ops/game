<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지뢰찾기 | 탐정의 사건 파일</title><style>
:root{--paper:#f2e6cc;--ink:#302b25;--red:#a43f31;--line:#b5a58b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:repeating-linear-gradient(0deg,#d6c8ae 0 2px,#dcd0b8 2px 6px);color:var(--ink);font-family:Georgia,'Noto Serif KR',serif;display:flex;justify-content:center;padding:30px 12px}.sheet{width:min(100%,980px);background:var(--paper);box-shadow:0 12px 0 #87745e,0 22px 35px #493b2a55;border:1px solid #a28d6c;padding:clamp(16px,4vw,42px);position:relative}.eyebrow{text-align:center;letter-spacing:.35em;font:700 12px system-ui;color:#786953}.heading{display:flex;align-items:center;justify-content:center;gap:15px;border-top:3px double var(--ink);border-bottom:3px double var(--ink);margin:14px 0 18px;padding:14px 0}h1{font-size:clamp(26px,5vw,46px);margin:0;letter-spacing:-.06em}.stamp{border:3px double var(--red);color:var(--red);font:900 13px system-ui;transform:rotate(-10deg);padding:7px;white-space:nowrap}.intro{text-align:center;font-size:14px;line-height:1.7}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:22px 0}button,select{font:700 14px system-ui;cursor:pointer;border:1px solid #574c3d;border-radius:0;background:#f9f0df;color:var(--ink);padding:10px 13px}button:hover{background:#e8d5b4}button:focus-visible,select:focus-visible,.cell:focus-visible{outline:3px solid var(--red);outline-offset:2px}button.active{background:var(--ink);color:#fff7e8}.dashboard{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:13px 4px;font:700 13px system-ui}.metric strong{display:block;font-size:24px;font-family:Georgia}.status{text-align:center;color:var(--red);font-weight:800}.board-scroll{overflow:auto;margin:22px auto 12px;max-width:100%;padding:5px}.board{display:grid;width:max-content;margin:auto;gap:2px;padding:5px;background:#6c5b46;border:3px solid #554632;box-shadow:4px 4px 0 #b5a58b}.cell{width:34px;height:34px;padding:0;border:1px solid #b4a181;background:#dfcba8;display:grid;place-items:center;font:bold 19px system-ui;user-select:none;touch-action:manipulation}.cell:hover:not(.open){background:#f9e9c8}.cell.open{background:#f5e9d3;border-color:#dfd1b8;cursor:default}.cell.flag{color:var(--red)}.cell.mine{background:#d69a8d}.cell[data-n="1"]{color:#315c79}.cell[data-n="2"]{color:#42683b}.cell[data-n="3"]{color:#a43f31}.cell[data-n="4"]{color:#654b80}.cell[data-n="5"]{color:#814d27}.cell[data-n="6"]{color:#327c7b}.foot{text-align:center;font-size:12px;color:#746651;border-top:1px solid var(--line);padding-top:16px;line-height:1.8}.result{min-height:24px;text-align:center;font-weight:bold;color:var(--red)}@media(max-width:520px){.cell{width:30px;height:30px;font-size:16px}.heading{gap:8px}.stamp{font-size:10px;padding:4px}.dashboard{font-size:11px}.metric strong{font-size:20px}}
</style></head><body><main class="sheet"><div class="eyebrow">THE DAILY MYSTERY · CASE NO. 001</div><div class="heading"><span class="stamp">TOP<br>SECRET</span><h1>탐정의 지뢰 수사</h1><span class="stamp">CLASSIFIED</span></div><p class="intro">수상한 칸을 조사하고 숨겨진 지뢰를 찾아 사건을 해결하세요.<br>숫자는 주변 여덟 칸에 숨은 지뢰의 개수입니다.</p><div class="controls"><label><span class="sr">난이도 </span><select id="level" aria-label="난이도"><option value="easy">초급 · 9×9</option><option value="medium">중급 · 16×16</option><option value="hard">고급 · 16×30</option></select></label><button id="restart">↻ 새 사건 시작</button><button id="mode" aria-pressed="false">🚩 깃발 모드: 끔</button></div><section class="dashboard" aria-label="게임 현황"><div class="metric">남은 지뢰<strong id="left">10</strong></div><div class="status" id="status">● 수사 진행 전</div><div class="metric" style="text-align:right">경과 시간<strong id="time">000초</strong></div></section><div class="board-scroll"><div id="board" class="board" role="grid" aria-label="지뢰찾기 판"></div></div><div id="result" class="result" aria-live="polite"></div><p class="foot">왼쪽 클릭: 조사 · 오른쪽 클릭: 깃발 · 모바일: 깃발 모드 전환<br>첫 번째 조사는 안전합니다. 모든 안전한 칸을 열면 승리합니다.</p></main><script>
(()=>{'use strict';const configs={easy:[9,9,10],medium:[16,16,40],hard:[16,30,99]};const board=document.querySelector('#board'),level=document.querySelector('#level'),left=document.querySelector('#left'),time=document.querySelector('#time'),status=document.querySelector('#status'),result=document.querySelector('#result'),mode=document.querySelector('#mode');let rows,cols,mines,cells,started,finished,flags,seconds,timer,flagMode=false;const idx=(r,c)=>r*cols+c;const neighbors=i=>{const r=Math.floor(i/cols),c=i%cols,a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let y=r+dr,x=c+dc;if(y>=0&&y<rows&&x>=0&&x<cols)a.push(idx(y,x))}return a};function init(){clearInterval(timer);[rows,cols,mines]=configs[level.value];cells=Array.from({length:rows*cols},()=>({mine:false,open:false,flag:false,n:0}));started=false;finished=false;flags=0;seconds=0;time.textContent='000초';status.textContent='● 수사 진행 전';result.textContent='';board.style.gridTemplateColumns=`repeat(${cols},var(--cell,34px))`;board.style.setProperty('--cell',window.innerWidth<=520?'30px':'34px');render()}function plant(first){const excluded=new Set([first,...neighbors(first)]);let options=cells.map((_,i)=>i).filter(i=>!excluded.has(i));if(options.length<mines)options=cells.map((_,i)=>i).filter(i=>i!==first);for(let j=options.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[options[j],options[k]]=[options[k],options[j]]}options.slice(0,mines).forEach(i=>cells[i].mine=true);cells.forEach((c,i)=>c.n=neighbors(i).filter(j=>cells[j].mine).length)}function start(first){plant(first);started=true;status.textContent='● 수사 진행 중';timer=setInterval(()=>{seconds++;time.textContent=String(seconds).padStart(3,'0')+'초'},1000)}function reveal(i){if(finished||cells[i].open||cells[i].flag)return;if(!started)start(i);if(cells[i].mine){cells[i].open=true;finish(false);return}let stack=[i];while(stack.length){let n=stack.pop(),c=cells[n];if(c.open||c.flag)continue;c.open=true;if(c.n===0)neighbors(n).forEach(j=>{if(!cells[j].open&&!cells[j].mine&&!cells[j].flag)stack.push(j)})}check();render()}function toggleFlag(i){let c=cells[i];if(finished||c.open)return;c.flag=!c.flag;flags+=c.flag?1:-1;check();render()}function check(){if(cells.filter(c=>c.open).length===cells.length-mines)finish(true)}function finish(win){finished=true;clearInterval(timer);status.textContent=win?'✓ 사건 해결':'✕ 수사 실패';result.textContent=win?`사건 해결! ${seconds}초 만에 모든 안전 구역을 조사했습니다.`:'지뢰를 발견했습니다. 새 사건에 도전하세요!';render()}function render(){left.textContent=mines-flags;board.replaceChildren();const frag=document.createDocumentFragment();cells.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.className='cell'+(c.open?' open':'')+(c.flag?' flag':'')+(c.open&&c.mine?' mine':'');b.dataset.n=c.open?c.n:0;b.textContent=c.open?(c.mine?'✹':c.n||''):(c.flag?'⚑':finished&&c.mine?'✹':'');b.setAttribute('role','gridcell');b.setAttribute('aria-label',`행 ${Math.floor(i/cols)+1}, 열 ${i%cols+1}, ${c.open?(c.mine?'지뢰':c.n+'개 인접 지뢰'):c.flag?'깃발':'미조사'}`);b.addEventListener('click',()=>flagMode?toggleFlag(i):reveal(i));b.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(i)});frag.append(b)});board.append(frag)}document.querySelector('#restart').addEventListener('click',init);level.addEventListener('change',init);mode.addEventListener('click',()=>{flagMode=!flagMode;mode.textContent='🚩 깃발 모드: '+(flagMode?'켬':'끔');mode.classList.toggle('active',flagMode);mode.setAttribute('aria-pressed',String(flagMode))});init()})();
</script></body></html>
