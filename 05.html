<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>몽글몽글 지뢰찾기</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 15%,#fff4c9,transparent 32%),radial-gradient(circle at 90% 80%,#fbd7ed,transparent 35%),#e7f7f2;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#66566a;display:flex;justify-content:center;padding:32px 12px}.app{width:min(100%,850px);text-align:center}.mascot{font-size:56px;filter:drop-shadow(0 6px 0 #ffffff99)}h1{margin:4px 0;font-size:clamp(26px,5vw,40px);color:#e78cab;letter-spacing:-1px}.subtitle{margin:0 0 22px;color:#948394}.panel{background:#fffdfd;border:4px solid #fff;border-radius:28px;box-shadow:0 12px 0 #d7e9e5,0 16px 28px #9eb7b733;padding:20px 14px 26px}.controls,.stats{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;margin-bottom:16px}button,select{font:inherit}select,.action{border:2px solid #f6d8e5;border-radius:16px;background:#fff7fb;color:#8a6e80;padding:10px 14px;font-weight:750;cursor:pointer}.action{background:#ffd9e8;border-color:#ffd9e8}.action:active{transform:translateY(2px)}.stat{background:#f5f5ff;padding:10px 18px;border-radius:16px;font-weight:800;min-width:110px}.status{min-height:26px;font-weight:800;color:#cc7a9b;margin:8px 0 14px}.board-wrap{overflow:auto;max-width:100%;padding:5px}.board{display:grid;gap:4px;width:max-content;margin:auto;background:#fff1f7;padding:8px;border-radius:17px;box-shadow:inset 0 0 0 2px #ffe0ed}.cell{width:35px;height:35px;border:0;border-radius:9px;background:#c7e9db;box-shadow:0 3px 0 #a6d2c2;display:grid;place-items:center;cursor:pointer;font-size:20px;font-weight:900;user-select:none;touch-action:manipulation;padding:0}.cell:nth-child(even){background:#d7f1e5}.cell.open{background:#fffdf8;box-shadow:none;cursor:default}.cell.flag{background:#ffe3ec}.cell.mine{background:#ffc1cb}.cell:focus-visible{outline:3px solid #e78cab;outline-offset:1px}.foot{font-size:13px;color:#a18d9d;margin:18px 0 0}.num1{color:#78a7d7}.num2{color:#72b99c}.num3{color:#e98e9c}.num4{color:#9e89d1}.num5{color:#d99a65}.num6{color:#64b8b7}.num7{color:#9a7c94}.num8{color:#7b8496}@media(max-width:550px){.panel{padding:16px 7px 20px}.cell{width:31px;height:31px;font-size:17px}.board{gap:3px;padding:6px}.stat{min-width:94px;padding:8px}}</style></head><body><main class="app"><div class="mascot" aria-hidden="true">🐰🌼</div><h1>몽글몽글 지뢰찾기</h1><p class="subtitle">꽃밭 속 숨은 폭탄을 피해보자! ♡</p><section class="panel"><div class="controls"><label for="level">난이도 </label><select id="level"><option value="easy">🌱 새싹 (9×9)</option><option value="medium">🌷 꽃봉오리 (16×16)</option><option value="hard">🌻 꽃밭 (16×30)</option></select><button class="action" id="restart">🔄 다시 시작</button><button class="action" id="flagmode" aria-pressed="false">🚩 깃발 모드 OFF</button></div><div class="stats"><div class="stat">💣 <span id="remaining">10</span>개</div><div class="stat">⏰ <span id="timer">0</span>초</div></div><div id="status" class="status" aria-live="polite">안전한 꽃잎을 눌러줘! 🌸</div><div class="board-wrap"><div id="board" class="board" role="grid" aria-label="지뢰찾기 게임판"></div></div><p class="foot">왼쪽 클릭: 열기 · 오른쪽 클릭: 깃발 · 모바일: 깃발 모드 사용<br>숫자는 주변 8칸에 숨은 폭탄의 개수예요.</p></section></main><script>(()=>{const levels={easy:[9,9,10],medium:[16,16,40],hard:[16,30,99]};const board=document.getElementById('board'),level=document.getElementById('level'),remaining=document.getElementById('remaining'),timer=document.getElementById('timer'),status=document.getElementById('status'),flagButton=document.getElementById('flagmode');let rows,cols,mines,cells,first,ended,flags,opened,seconds,interval,flagMode=false;function neighbors(i){const r=Math.floor(i/cols),c=i%cols,out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let nr=r+dr,nc=c+dc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols)out.push(nr*cols+nc)}return out}function start(){clearInterval(interval);[rows,cols,mines]=levels[level.value];first=true;ended=false;flags=opened=seconds=0;timer.textContent='0';remaining.textContent=mines;status.textContent='안전한 꽃잎을 눌러줘! 🌸';cells=Array.from({length:rows*cols},()=>({mine:false,open:false,flag:false,count:0}));board.style.gridTemplateColumns=`repeat(${cols},max-content)`;board.replaceChildren();cells.forEach((_,i)=>{let b=document.createElement('button');b.className='cell';b.type='button';b.setAttribute('role','gridcell');b.setAttribute('aria-label',`닫힌 칸 ${Math.floor(i/cols)+1}행 ${i%cols+1}열`);b.addEventListener('click',()=>flagMode?toggleFlag(i):reveal(i));b.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(i)});board.append(b)})}function place(safe){let blocked=new Set([safe,...neighbors(safe)]),pool=cells.map((_,i)=>i).filter(i=>!blocked.has(i));if(pool.length<mines)pool=cells.map((_,i)=>i).filter(i=>i!==safe);for(let k=0;k<mines;k++){let j=k+Math.floor(Math.random()*(pool.length-k));[pool[k],pool[j]]=[pool[j],pool[k]];cells[pool[k]].mine=true}cells.forEach((c,i)=>c.count=neighbors(i).filter(n=>cells[n].mine).length)}function draw(i){let c=cells[i],b=board.children[i];b.className='cell'+(c.open?' open':'')+(c.flag?' flag':'')+(c.open&&c.mine?' mine':'');b.textContent=c.flag?'🚩':c.open?(c.mine?'💣':c.count||''):'';if(c.open&&c.count&&!c.mine)b.classList.add('num'+c.count);b.setAttribute('aria-label',c.flag?'깃발 표시':c.open?(c.mine?'지뢰':c.count?`주변 지뢰 ${c.count}개`:'빈 칸'):'닫힌 칸')}function toggleFlag(i){let c=cells[i];if(ended||c.open)return;c.flag=!c.flag;flags+=c.flag?1:-1;remaining.textContent=mines-flags;draw(i)}function reveal(i){let c=cells[i];if(ended||c.flag||c.open)return;if(first){place(i);first=false;interval=setInterval(()=>{seconds++;timer.textContent=seconds},1000)}if(c.mine){c.open=true;draw(i);finish(false);return}let queue=[i];while(queue.length){let n=queue.pop(),x=cells[n];if(x.open||x.flag||x.mine)continue;x.open=true;opened++;draw(n);if(x.count===0)neighbors(n).forEach(j=>{if(!cells[j].open&&!cells[j].flag)queue.push(j)})}if(opened===cells.length-mines)finish(true)}function finish(win){ended=true;clearInterval(interval);status.textContent=win?'🎉 야호! 꽃밭을 모두 지켰어!':'🥺 앗! 폭탄을 찾았네. 다시 해보자!';if(!win)cells.forEach((c,i)=>{if(c.mine&&!c.flag){c.open=true;draw(i)}});else{cells.forEach((c,i)=>{if(c.mine&&!c.flag){c.flag=true;draw(i)}});remaining.textContent='0'}}document.getElementById('restart').addEventListener('click',start);level.addEventListener('change',start);flagButton.addEventListener('click',()=>{flagMode=!flagMode;flagButton.textContent=`🚩 깃발 모드 ${flagMode?'ON':'OFF'}`;flagButton.setAttribute('aria-pressed',String(flagMode))});start()})();</script></body></html>
