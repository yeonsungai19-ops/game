<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지뢰찾기 | MINESWEEPER</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--tile:#26334c;--line:#35435e;--text:#f3f6ff;--muted:#a8b5ce;--accent:#8b9dff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#202a51 0%,var(--bg) 65%);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;justify-content:center;padding:36px 14px}main{width:min(100%,960px)}header{text-align:center;margin-bottom:25px}h1{font-size:clamp(29px,5vw,44px);margin:5px 0;letter-spacing:-1px}header p{color:var(--muted);margin:6px}.panel{background:var(--panel);border:1px solid #33405a;border-radius:20px;padding:20px;box-shadow:0 18px 50px #0005}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}button,select{font:inherit;color:var(--text);background:#273450;border:1px solid #485776;border-radius:11px;padding:10px 13px;cursor:pointer}button:hover,select:hover{background:#354565}button:focus-visible,select:focus-visible{outline:3px solid #c3ccff;outline-offset:2px}.primary{background:#6378ed;border-color:#7f91ff;font-weight:700}.primary:hover{background:#788bff}.active{background:#5063b9;border-color:#a3b0ff}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px 0}.stat{min-width:120px;text-align:center;padding:10px 18px;background:#10182a;border:1px solid #303d57;border-radius:13px}.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.stat strong{font-variant-numeric:tabular-nums;font-size:23px}.status{text-align:center;min-height:25px;font-weight:650;margin:12px 0;color:#cdd6ff}.board-scroll{overflow:auto;max-width:100%;padding:6px 0 12px}.board{--cell:36px;display:grid;gap:3px;width:max-content;margin:auto;padding:9px;background:#0d1526;border:1px solid #34425d;border-radius:13px;touch-action:manipulation}.cell{width:var(--cell);height:var(--cell);border:1px solid #415374;border-radius:6px;padding:0;background:var(--tile);display:grid;place-items:center;font-size:calc(var(--cell)*.53);font-weight:800;user-select:none;-webkit-user-select:none;line-height:1}.cell:hover:not(:disabled){background:#3a4c70}.cell.revealed{background:#141f34;border-color:#25324b;cursor:default}.cell.mine{background:#ad394f}.cell.wrong{background:#703748}.cell:disabled{opacity:1;color:inherit}.n1{color:#73b4ff}.n2{color:#69d8a0}.n3{color:#ff8795}.n4{color:#b29aff}.n5{color:#ffb26d}.n6{color:#75e5e6}.n7{color:#f1a6ea}.n8{color:#d0d7e6}.help{text-align:center;color:var(--muted);font-size:13px;line-height:1.8;margin:17px 0 0}.help kbd{border:1px solid #58647b;border-radius:4px;padding:1px 5px;color:#e9efff}@media(max-width:600px){body{padding:17px 9px}.panel{padding:12px}.board{--cell:31px;gap:2px;padding:6px}.stat{min-width:95px;padding:8px 10px}.toolbar{gap:7px}button,select{padding:9px 10px}}
</style>
</head>
<body><main><header><h1>💣 지뢰찾기</h1><p>숨어 있는 지뢰를 피해 모든 안전한 칸을 열어보세요.</p></header><section class="panel"><div class="toolbar"><label for="difficulty">난이도</label><select id="difficulty"><option value="easy">초급 · 9×9 · 10개</option><option value="medium">중급 · 16×16 · 40개</option><option value="hard">고급 · 16×30 · 99개</option></select><button class="primary" id="reset">↻ 새 게임</button><button id="flagMode" aria-pressed="false">🚩 깃발 모드: 꺼짐</button></div><div class="stats"><div class="stat"><small>남은 지뢰</small><strong id="remaining">10</strong></div><div class="stat"><small>경과 시간</small><strong id="timer">000</strong></div><div class="stat"><small>진행률</small><strong id="progress">0%</strong></div></div><div class="status" id="status" role="status" aria-live="polite">첫 번째 칸을 선택하세요!</div><div class="board-scroll"><div id="board" class="board" role="grid" aria-label="지뢰찾기 게임판"></div></div><p class="help">PC: <kbd>좌클릭</kbd> 칸 열기 · <kbd>우클릭</kbd> 깃발 표시<br>모바일: 깃발 모드를 켜면 터치로 깃발을 표시할 수 있어요.<br>열린 숫자 칸을 다시 누르면 주변 깃발 수가 맞을 때 이웃 칸을 한 번에 엽니다.</p></section></main>
<script>
(()=>{'use strict';
const presets={easy:[9,9,10],medium:[16,16,40],hard:[16,30,99]};
const $=id=>document.getElementById(id);const board=$('board'),remaining=$('remaining'),timer=$('timer'),progress=$('progress'),status=$('status'),difficulty=$('difficulty'),flagButton=$('flagMode');
let rows,cols,mines,cells,first,ended,flags,opened,seconds,interval,flagMode=false;
const neighbors=(r,c)=>{const out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let nr=r+dr,nc=c+dc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols)out.push(nr*cols+nc)}return out};
function update(){remaining.textContent=mines-flags;timer.textContent=String(Math.min(seconds,999)).padStart(3,'0');progress.textContent=Math.floor(opened/(rows*cols-mines)*100)+'%'}
function startClock(){if(interval)return;interval=setInterval(()=>{seconds++;update()},1000)}
function stopClock(){clearInterval(interval);interval=null}
function newGame(){stopClock();[rows,cols,mines]=presets[difficulty.value];cells=Array.from({length:rows*cols},()=>({mine:false,count:0,open:false,flag:false}));first=true;ended=false;flags=0;opened=0;seconds=0;status.textContent='첫 번째 칸을 선택하세요!';board.innerHTML='';board.style.gridTemplateColumns=`repeat(${cols},var(--cell))`;const fragment=document.createDocumentFragment();cells.forEach((_,i)=>{const b=document.createElement('button');b.className='cell';b.type='button';b.dataset.i=i;b.setAttribute('role','gridcell');b.setAttribute('aria-label',`${Math.floor(i/cols)+1}행 ${i%cols+1}열, 닫힘`);fragment.appendChild(b)});board.appendChild(fragment);update()}
function placeMines(safe){const excluded=new Set([safe,...neighbors(Math.floor(safe/cols),safe%cols)]);let candidates=cells.map((_,i)=>i).filter(i=>!excluded.has(i));if(candidates.length<mines)candidates=cells.map((_,i)=>i).filter(i=>i!==safe);for(let i=0;i<mines;i++){const j=i+Math.floor(Math.random()*(candidates.length-i));[candidates[i],candidates[j]]=[candidates[j],candidates[i]];cells[candidates[i]].mine=true}cells.forEach((cell,i)=>{if(!cell.mine)cell.count=neighbors(Math.floor(i/cols),i%cols).filter(j=>cells[j].mine).length})}
function paint(i){const c=cells[i],el=board.children[i];el.className='cell'+(c.open?' revealed':'')+(c.open&&c.mine?' mine':'')+(c.open&&c.count?' n'+c.count:'');el.textContent=c.open?(c.mine?'💣':c.count||''):(c.flag?'🚩':'');el.setAttribute('aria-label',`${Math.floor(i/cols)+1}행 ${i%cols+1}열, `+(c.open?(c.mine?'지뢰':c.count?`주변 지뢰 ${c.count}개`:'빈 칸'):c.flag?'깃발':'닫힘'))}
function lose(hit){ended=true;stopClock();cells.forEach((c,i)=>{if(c.mine){c.open=true;paint(i)}else if(c.flag){const el=board.children[i];el.classList.add('wrong');el.textContent='✖'}});board.children[hit].classList.add('mine');status.textContent='💥 지뢰를 밟았어요! 새 게임에 도전하세요.'}
function winCheck(){if(opened!==rows*cols-mines)return;ended=true;stopClock();cells.forEach((c,i)=>{if(c.mine&&!c.flag){c.flag=true;flags++;paint(i)}});update();status.textContent=`🎉 성공! ${seconds}초 만에 모든 안전한 칸을 찾았어요!`}
function reveal(i){if(ended)return;const c=cells[i];if(c.flag||c.open)return;if(first){placeMines(i);first=false;startClock();status.textContent='지뢰를 조심하며 계속 진행하세요!'}if(c.mine){lose(i);return}const stack=[i];while(stack.length){const k=stack.pop(),cell=cells[k];if(cell.open||cell.flag||cell.mine)continue;cell.open=true;opened++;paint(k);if(cell.count===0)stack.push(...neighbors(Math.floor(k/cols),k%cols))}update();winCheck()}
function toggleFlag(i){if(ended||cells[i].open)return;cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;paint(i);update()}
function chord(i){const c=cells[i];if(!c.open||!c.count||ended)return;const ns=neighbors(Math.floor(i/cols),i%cols);if(ns.filter(j=>cells[j].flag).length!==c.count)return;for(const j of ns){if(ended)break;if(!cells[j].flag&&!cells[j].open)reveal(j)}}
board.addEventListener('click',e=>{const el=e.target.closest('.cell');if(!el)return;const i=Number(el.dataset.i);if(flagMode)toggleFlag(i);else if(cells[i].open)chord(i);else reveal(i)});board.addEventListener('contextmenu',e=>{const el=e.target.closest('.cell');if(!el)return;e.preventDefault();toggleFlag(Number(el.dataset.i))});
flagButton.addEventListener('click',()=>{flagMode=!flagMode;flagButton.classList.toggle('active',flagMode);flagButton.setAttribute('aria-pressed',String(flagMode));flagButton.textContent='🚩 깃발 모드: '+(flagMode?'켜짐':'꺼짐')});$('reset').addEventListener('click',newGame);difficulty.addEventListener('change',newGame);newGame();
})();
</script></body></html>
