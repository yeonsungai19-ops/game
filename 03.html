<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>파스텔 가든 | 지뢰찾기</title><style>:root{--bg:#f8f0f6;--panel:#fffdfc;--text:#51475a;--border:1px solid #f2dce8;--cellborder:1px solid #e6dce8;--radius:28px;--small:12px;--shadow:0 22px 65px #d6b7ce55;--button:#f8e8f0;--tile:#f1e9fc;--open:#fff9f0;--accent:#bd5b91;--activeText:white;--cell:36px;--mobilecell:31px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:38px 14px;font-family:system-ui,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--text)}.app{width:min(100%,960px);background:var(--panel);border:var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}h1{margin:0;font-size:clamp(25px,4vw,36px)}.sub{opacity:.75;margin:7px 0 22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}select,button{font:inherit;border:var(--border);border-radius:var(--small);padding:10px 14px;background:var(--button);color:var(--text);cursor:pointer}button:hover,select:hover{filter:brightness(.94)}button:focus-visible,select:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 16px}.stat{background:var(--tile);padding:11px 16px;border-radius:var(--small);min-width:115px;font-weight:700}.stat span{display:block;font-size:12px;font-weight:500;opacity:.7;margin-bottom:4px}.board-scroll{overflow:auto;max-width:100%;padding:5px 3px 14px}.board{display:grid;gap:3px;width:max-content;margin:auto;touch-action:manipulation;user-select:none}.cell{width:var(--cell);height:var(--cell);padding:0;border:var(--cellborder);border-radius:var(--small);background:var(--tile);display:grid;place-items:center;font-size:calc(var(--cell) * .52);font-weight:900;line-height:1}.cell.open{background:var(--open);border-color:transparent;cursor:default}.cell.flag{color:#e84b54}.cell.mine{background:#ffb2a9}.cell.n1{color:#2679dc}.cell.n2{color:#198c53}.cell.n3{color:#d84b43}.cell.n4{color:#7652bb}.cell.n5{color:#b66a1d}.cell.n6{color:#009b9e}.cell.n7{color:#444}.cell.n8{color:#777}.status{min-height:26px;margin:10px 0;font-weight:700;color:var(--accent)}.hint{font-size:13px;opacity:.7;line-height:1.6}.active{background:var(--accent);color:var(--activeText)}@media(max-width:560px){.app{padding:16px}.cell{width:var(--mobilecell);height:var(--mobilecell);font-size:18px}.stat{min-width:90px;padding:9px}.controls{width:100%}}
</style></head><body><main class="app"><div class="top"><div><h1>🌷 파스텔 가든</h1><p class="sub">부드러운 색감의 편안한 지뢰찾기</p></div><div class="controls"><label for="difficulty">난이도 </label><select id="difficulty"><option value="easy">초급 9×9</option><option value="medium">중급 16×16</option><option value="hard">고급 30×16</option></select><button id="restart">↻ 새 게임</button></div></div><div class="stats"><div class="stat"><span>남은 지뢰</span><strong id="remaining">10</strong></div><div class="stat"><span>경과 시간</span><strong id="time">0</strong>초</div><button id="mode" aria-label="깃발 모드 전환">🚩 깃발 모드 OFF</button></div><div id="status" class="status" role="status"></div><div class="board-scroll"><div id="board" class="board" aria-label="지뢰찾기 게임판"></div></div><p class="hint">왼쪽 클릭: 칸 열기 · 오른쪽 클릭: 깃발 표시 · 모바일: 깃발 모드를 켜서 표시하세요. 첫 클릭은 안전합니다.</p></main><script>
const presets={easy:[9,9,10],medium:[16,16,40],hard:[16,30,99]};
let rows,cols,total,board,first,ended,flags,seconds,timer,flagMode=false;
const el=id=>document.getElementById(id);
function reset(){clearInterval(timer);timer=null;seconds=0;flags=0;first=true;ended=false;[rows,cols,total]=presets[el('difficulty').value];board=Array.from({length:rows*cols},()=>({mine:false,count:0,open:false,flag:false}));el('time').textContent='0';el('remaining').textContent=total;el('status').textContent='게임을 시작해 보세요!';el('board').style.gridTemplateColumns=`repeat(${cols},var(--cell))`;render();}
function neighbors(i){let r=Math.floor(i/cols),c=i%cols,a=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let nr=r+dr,nc=c+dc;if((dr||dc)&&nr>=0&&nr<rows&&nc>=0&&nc<cols)a.push(nr*cols+nc)}return a}
function plant(safe){let excluded=new Set([safe,...neighbors(safe)]);let spots=board.map((_,i)=>i).filter(i=>!excluded.has(i));if(spots.length<total)spots=board.map((_,i)=>i).filter(i=>i!==safe);for(let i=spots.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[spots[i],spots[j]]=[spots[j],spots[i]]}spots.slice(0,total).forEach(i=>board[i].mine=true);board.forEach((b,i)=>b.count=neighbors(i).filter(j=>board[j].mine).length)}
function startClock(){timer=setInterval(()=>{seconds++;el('time').textContent=seconds},1000)}
function reveal(i){let b=board[i];if(ended||b.flag||b.open)return;if(first){plant(i);first=false;startClock()}if(b.mine){b.open=true;finish(false);return}let stack=[i];while(stack.length){let k=stack.pop(),x=board[k];if(x.open||x.flag)continue;x.open=true;if(x.count===0)neighbors(k).forEach(j=>{if(!board[j].open&&!board[j].mine&&!board[j].flag)stack.push(j)})}if(board.every(x=>x.mine||x.open))finish(true);render()}
function toggleFlag(i){let b=board[i];if(ended||b.open)return;b.flag=!b.flag;flags+=b.flag?1:-1;el('remaining').textContent=total-flags;render()}
function finish(win){ended=true;clearInterval(timer);if(!win)board.forEach(x=>{if(x.mine)x.open=true});el('status').textContent=win?`🎉 성공! ${seconds}초 만에 모든 지뢰를 찾았어요!`:'💥 지뢰를 밟았어요! 다시 도전해 보세요.';render()}
function render(){const root=el('board');root.replaceChildren();board.forEach((b,i)=>{let x=document.createElement('button');x.type='button';x.className='cell'+(b.open?' open':'')+(b.flag?' flag':'')+(b.open&&b.mine?' mine':'')+(b.open&&b.count?' n'+b.count:'');x.textContent=b.flag?'🚩':b.open?(b.mine?'💣':b.count||''):'';x.setAttribute('aria-label',`${Math.floor(i/cols)+1}행 ${i%cols+1}열 ${b.open?(b.mine?'지뢰':b.count+'개 인접 지뢰'):b.flag?'깃발':'닫힘'}`);x.addEventListener('click',()=>flagMode?toggleFlag(i):reveal(i));x.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(i)});root.appendChild(x)})}
el('difficulty').addEventListener('change',reset);el('restart').addEventListener('click',reset);el('mode').addEventListener('click',()=>{flagMode=!flagMode;el('mode').classList.toggle('active',flagMode);el('mode').textContent=flagMode?'🚩 깃발 모드 ON':'🚩 깃발 모드 OFF'});reset();
</script></body></html>
